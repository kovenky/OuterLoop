[project]
name = "outerloop"
version = "0.1.0"
description = "A tiny self-correcting code-generation loop using OpenRouter, OpenAI, or Anthropic."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "pytest>=8.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]

[project.scripts]
outerloop = "src.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
